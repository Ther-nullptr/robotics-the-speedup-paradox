name: 接力开发任务
description: 提出或认领一个范围与验收清楚的小任务。
title: "[任务] "
body:
  - type: markdown
    attributes:
      value: |
        当前仓库提供协议、schema 与 CPU 校验，没有推理或仿真实现。
        在本 Issue 记录范围、验收、负责人及接力状态，无需额外提交阶段任务卡。
        稳定接口和实验口径的变化仍同步更新仓内协议。
  - type: input
    id: related_work
    attributes:
      label: 关联工作
      description: 关联 Issue/PR 或长期方向；新任务可写“无”。
      placeholder: "例如：CPU 调度语义；关联 #12"
    validations:
      required: true
  - type: input
    id: people
    attributes:
      label: Owner / reviewer
      description: 填 GitHub 用户名；未确认的角色写“待认领”，不代替他人承诺。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 要改变的可观察行为
      description: 用一个输入、时间线或错误说明本次任务要解决的问题。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与依赖
      description: 允许修改的文件、明确排除项、前置 PR/契约版本与 baseline commit。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收与环境
      description: 最小命令、预期结果、所需环境；明确是否能无 GPU 完成。
      placeholder: |
        命令：
        预期结果或负面案例：
        环境 / 资产：
    validations:
      required: true
