name: 接力开发任务
description: 认领已有任务卡，或提出一个可验收的小任务。
title: "[任务] "
body:
  - type: markdown
    attributes:
      value: |
        当前仓库提供协议、schema 与 CPU 校验，没有推理或仿真实现。
        完整范围保存在 docs/tasks/ 的任务卡；Issue 记录认领、讨论和状态。
        已有任务只引用卡片路径，下面填必要摘要；不要重复维护两份完整规范。
  - type: input
    id: task_card
    attributes:
      label: 任务卡
      description: 仓库相对路径；新任务写“待创建”及拟定 ID。
      placeholder: docs/tasks/010-cpu-scheduler.md
    validations:
      required: true
  - type: input
    id: people
    attributes:
      label: Owner / reviewer
      description: 填 GitHub 用户名；未确认的角色写“待认领”，不代替他人承诺。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 要改变的可观察行为
      description: 用一个输入、时间线或错误说明问题；已有卡片可只写本次子任务。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与依赖
      description: 允许修改的文件、明确排除项、前置 PR/契约版本与 baseline commit。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收与环境
      description: 最小命令、预期结果、所需环境；明确是否能无 GPU 完成。
      placeholder: |
        命令：
        预期结果或负面案例：
        环境 / 资产：
    validations:
      required: true
