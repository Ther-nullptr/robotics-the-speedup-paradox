name: 任务 / Task
description: 明确case、范围和验收 / Define the case, scope and acceptance criteria.
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: |
        当前已有CPU工具及π0.5＋LIBERO、Cosmos＋LIBERO、Cosmos＋RoboCasa静态入口。
        CPU tools and three static inference/simulator cases are available; dynamic cases remain planned.
        在此记录范围、验收和负责人；小改动可直接在PR说明，无需额外提交阶段任务卡。
        Record scope and acceptance here; small independent changes can describe them directly in a PR.
  - type: input
    id: related_work
    attributes:
      label: 关联工作 / Related work
      description: 填实验路径/case（static/<case>、dynamic/<case>或shared）及关联 Issue/PR；无关联可写“无”。
      placeholder: "例如：static/pi05_libero；关联 #12"
    validations:
      required: true
  - type: input
    id: people
    attributes:
      label: Owner / reviewer
      description: 填 GitHub 用户名；未确认的角色写“待认领”，不代替他人承诺。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 行为变化 / Behavior change
      description: 用一个输入、时间线或错误说明本次任务要解决的问题。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与依赖 / Scope and dependencies
      description: 允许修改的文件、明确排除项、前置 PR/契约版本与 baseline commit。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收与环境 / Validation and environment
      description: 最小命令、预期结果、所需环境；明确是否能无 GPU 完成。
      placeholder: |
        命令：
        预期结果或负面案例：
        环境 / 资产：
    validations:
      required: true
